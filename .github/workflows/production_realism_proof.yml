name: production-realism-proof

on:
  pull_request:
    paths:
      - quality_production_realism_proof.py
      - quality_edge_voice_probe.py
      - tests/test_quality_production_realism_proof.py
      - quality_downstream_factory_proof.py
      - main.py
      - quality_audio_qa.py
      - requirements.txt
      - .github/workflows/production_realism_proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-realism-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "checked_out_sha=$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure local media prerequisites
        uses: ./.github/actions/media-prereqs
      - name: Install render dependencies
        run: pip install -r requirements.txt

      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voice-en_US-ryan-high-v1

      - name: Fetch fixed Piper voice if cache is cold
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voices
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high"
          if [ ! -s voices/voice.onnx ]; then
            curl -fsSL -o voices/voice.onnx "$BASE/en_US-ryan-high.onnx"
            curl -fsSL -o voices/voice.onnx.json "$BASE/en_US-ryan-high.onnx.json"
          fi
          test -s voices/voice.onnx
          test -s voices/voice.onnx.json

      - name: Prefetch production Whisper alignment model
        env:
          WHISPER_MODEL: base
        run: |
          set -euo pipefail
          # Production main.whisper_align() defaults to faster-whisper `base`.
          # Fetch/model-conversion is setup, not rendering. The actual proofs below
          # use HF offline whenever Whisper may be needed.
          python - <<'PY'
          import os
          from faster_whisper import WhisperModel
          WhisperModel(os.environ.get('WHISPER_MODEL', 'base'), device='cpu', compute_type='int8')
          print('whisper_model_prefetched=' + os.environ.get('WHISPER_MODEL', 'base'))
          PY

      - name: Run zero-provider contract tests
        env:
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          CEREBRAS_API_KEY: ""
          TOGETHER_API_KEY: ""
          FIREWORKS_API_KEY: ""
          MISTRAL_API_KEY: ""
          PEXELS_API_KEY: ""
          ELEVENLABS_API_KEY: ""
          FAL_KEY: ""
          FAL_API_KEY: ""
        run: |
          set -euo pipefail
          python tests/test_quality_production_realism_proof.py
          python -m py_compile quality_production_realism_proof.py quality_edge_voice_probe.py

      - name: Probe actual default Edge neural voice route
        env:
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          CEREBRAS_API_KEY: ""
          TOGETHER_API_KEY: ""
          FIREWORKS_API_KEY: ""
          MISTRAL_API_KEY: ""
          PEXELS_API_KEY: ""
          ELEVENLABS_API_KEY: ""
          FAL_KEY: ""
          FAL_API_KEY: ""
          VOICE_ENGINE: "edge"
          WHISPER_MODEL: base
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          python quality_edge_voice_probe.py --out artifacts/production_realism_proof/edge_voice
          test -s artifacts/production_realism_proof/edge_voice/edge_voice.mp3
          test -s artifacts/production_realism_proof/edge_voice/edge_voice_report.json
          python - <<'PY'
          import json
          p=json.load(open('artifacts/production_realism_proof/edge_voice/edge_voice_report.json'))
          assert p['schema'] == 'content-render-edge-voice-probe-v1'
          assert p['tts_router_used'] == 'main.tts_full'
          assert p['requested_engine'] == 'edge'
          assert p['piper_fallback_attempted'] is False
          assert p['edge_python_api_calls'] >= 1
          assert p['timing']['timing_count'] > 0
          assert abs(p['timing']['timing_count'] - p['timing']['script_word_count']) <= max(3, int(0.2*p['timing']['script_word_count']))
          assert p['provider_calls_made'] == 0
          assert p['publishing_side_effects'] == 0
          print(json.dumps(p, indent=2, sort_keys=True))
          PY

      - name: Render real 1080p Piper + Whisper proof
        env:
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          CEREBRAS_API_KEY: ""
          TOGETHER_API_KEY: ""
          FIREWORKS_API_KEY: ""
          MISTRAL_API_KEY: ""
          PEXELS_API_KEY: ""
          ELEVENLABS_API_KEY: ""
          FAL_KEY: ""
          FAL_API_KEY: ""
          POLLINATIONS_API_KEY: ""
          MUSIC_URL: ""
          SFX_CUTS: "0"
          MUSIC_DUCK: "1"
          VOICE_ENGINE: "piper"
          PIPER_MODEL: ${{ github.workspace }}/voices/voice.onnx
          WHISPER_MODEL: base
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          python quality_production_realism_proof.py --out artifacts/production_realism_proof/piper_video
          test -s artifacts/production_realism_proof/piper_video/out/final.mp4
          test -s artifacts/production_realism_proof/piper_video/out/audio_qa_report.json
          test -s artifacts/production_realism_proof/piper_video/out/proof_frame.jpg
          test -s artifacts/production_realism_proof/piper_video/proof_report.json
          python - <<'PY'
          import json
          p=json.load(open('artifacts/production_realism_proof/piper_video/proof_report.json'))
          assert p['schema'] == 'content-render-production-realism-proof-v2'
          assert p['tts_router_used'] == 'main.tts_full'
          assert p['piper_used'] is True
          assert p['piper_call_results'] == [True]
          assert p['whisper_alignment_used'] is True
          assert p['whisper_model'] == 'base'
          assert p['alignment']['aligned_word_count'] == p['alignment']['expected_script_words']
          assert p['caption_timing_source'] == 'faster_whisper_content_aligned_piper_audio'
          assert p['production_canvas'] == [1080, 1920]
          assert p['final']['width'] == 1080 and p['final']['height'] == 1920
          assert p['final']['audio_codec'] == 'aac'
          assert p['final']['audio_sample_rate'] == 48000
          assert p['audio_mechanical_pass'] is True
          assert p['provider_calls_made'] == 0
          assert p['network_calls_made'] == 0
          assert p['caption_dialogue_lines'] >= p['scene_count']
          print(json.dumps(p, indent=2, sort_keys=True))
          PY

      - name: Upload production-realism evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-realism-proof-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/production_realism_proof/edge_voice/edge_voice.mp3
            artifacts/production_realism_proof/edge_voice/edge_voice_report.json
            artifacts/production_realism_proof/piper_video/out/final.mp4
            artifacts/production_realism_proof/piper_video/out/audio_qa_report.json
            artifacts/production_realism_proof/piper_video/out/proof_frame.jpg
            artifacts/production_realism_proof/piper_video/proof_report.json
            artifacts/production_realism_proof/piper_video/manifest.json
          if-no-files-found: error
          retention-days: 3
