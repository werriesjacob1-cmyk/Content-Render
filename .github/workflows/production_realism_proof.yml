name: production-realism-proof

on:
  pull_request:
    paths:
      - quality_production_realism_proof.py
      - tests/test_quality_production_realism_proof.py
      - quality_downstream_factory_proof.py
      - main.py
      - quality_audio_qa.py
      - requirements.txt
      - .github/workflows/production_realism_proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-realism-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "checked_out_sha=$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure local media prerequisites
        shell: bash
        run: |
          set -euo pipefail
          need_apt=0
          command -v ffmpeg >/dev/null 2>&1 || need_apt=1
          font_family="$(fc-match -f '%{family}' 'DejaVu Sans' 2>/dev/null || true)"
          case "$font_family" in *DejaVu*) ;; *) need_apt=1 ;; esac
          if [ "$need_apt" -eq 1 ]; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null

      - name: Install render dependencies
        run: pip install -r requirements.txt

      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voice-en_US-ryan-high-v1

      - name: Fetch fixed Piper voice if cache is cold
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voices
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high"
          if [ ! -s voices/voice.onnx ]; then
            curl -fsSL -o voices/voice.onnx "$BASE/en_US-ryan-high.onnx"
            curl -fsSL -o voices/voice.onnx.json "$BASE/en_US-ryan-high.onnx.json"
          fi
          test -s voices/voice.onnx
          test -s voices/voice.onnx.json

      - name: Run zero-provider contract tests
        env:
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          CEREBRAS_API_KEY: ""
          TOGETHER_API_KEY: ""
          FIREWORKS_API_KEY: ""
          MISTRAL_API_KEY: ""
          PEXELS_API_KEY: ""
          ELEVENLABS_API_KEY: ""
          FAL_KEY: ""
          FAL_API_KEY: ""
        run: |
          set -euo pipefail
          python tests/test_quality_production_realism_proof.py
          python -m py_compile quality_production_realism_proof.py

      - name: Render real 1080p Piper proof
        env:
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          CEREBRAS_API_KEY: ""
          TOGETHER_API_KEY: ""
          FIREWORKS_API_KEY: ""
          MISTRAL_API_KEY: ""
          PEXELS_API_KEY: ""
          ELEVENLABS_API_KEY: ""
          FAL_KEY: ""
          FAL_API_KEY: ""
          POLLINATIONS_API_KEY: ""
          MUSIC_URL: ""
          SFX_CUTS: "0"
          MUSIC_DUCK: "1"
          VOICE_ENGINE: "piper"
          PIPER_MODEL: ${{ github.workspace }}/voices/voice.onnx
        run: |
          set -euo pipefail
          python quality_production_realism_proof.py --out artifacts/production_realism_proof
          test -s artifacts/production_realism_proof/out/final.mp4
          test -s artifacts/production_realism_proof/out/audio_qa_report.json
          test -s artifacts/production_realism_proof/out/proof_frame.jpg
          test -s artifacts/production_realism_proof/proof_report.json
          python - <<'PY'
          import json
          p=json.load(open('artifacts/production_realism_proof/proof_report.json'))
          assert p['piper_used'] is True
          assert p['production_canvas'] == [1080, 1920]
          assert p['final']['width'] == 1080 and p['final']['height'] == 1920
          assert p['final']['audio_codec'] == 'aac'
          assert p['final']['audio_sample_rate'] == 48000
          assert p['audio_mechanical_pass'] is True
          assert p['provider_calls_made'] == 0
          assert p['network_calls_made'] == 0
          assert p['caption_dialogue_lines'] >= p['scene_count']
          print(json.dumps(p, indent=2, sort_keys=True))
          PY

      - name: Upload production-realism evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-realism-proof-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/production_realism_proof/out/final.mp4
            artifacts/production_realism_proof/out/audio_qa_report.json
            artifacts/production_realism_proof/out/proof_frame.jpg
            artifacts/production_realism_proof/proof_report.json
            artifacts/production_realism_proof/manifest.json
          if-no-files-found: error
          retention-days: 3
