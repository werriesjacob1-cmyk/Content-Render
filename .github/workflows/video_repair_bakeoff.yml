name: video-repair-bakeoff
on:
  workflow_dispatch:
    inputs:
      source_video_url:
        description: "Public URL of the already-generated clip to repair"
        required: true
        type: string
      kind:
        description: "Repair kind"
        required: true
        default: "baked_text"
        type: choice
        options: [wrong_subject, baked_text, background, anatomy_or_object, style_harmonization, continuity, other]
      instruction:
        description: "Exact problem to fix — do not include creative extras"
        required: true
        type: string
      preserve:
        description: "Semicolon-separated things that MUST remain unchanged"
        required: true
        default: "central subject;camera motion;scientific context"
        type: string
      duration:
        description: "Repair duration seconds (1-10)"
        required: true
        default: "5"
        type: string
      models:
        description: "Repair aliases"
        required: true
        default: "ltx23_retake,luma_ray32"
        type: string
      max_budget_usd:
        description: "HARD pre-call ceiling"
        required: true
        default: "1.25"
        type: string
      plan_only:
        description: "Zero-spend repair plan only"
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install FAL client for paid mode only
        if: ${{ !inputs.plan_only }}
        run: pip install fal-client
      - name: Plan or run constrained repair
        env:
          SOURCE: ${{ inputs.source_video_url }}
          KIND: ${{ inputs.kind }}
          INSTRUCTION: ${{ inputs.instruction }}
          PRESERVE: ${{ inputs.preserve }}
          DURATION: ${{ inputs.duration }}
          MODELS: ${{ inputs.models }}
          MAX_BUDGET: ${{ inputs.max_budget_usd }}
          PLAN_ONLY: ${{ inputs.plan_only }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$PLAN_ONLY" = "true" ]; then EXTRA="--plan-only"; fi
          ARGS=()
          IFS=';' read -ra PARTS <<< "$PRESERVE"
          for p in "${PARTS[@]}"; do
            p="${p#" ${p%%[![:space:]]*}"}"
            p="${p%" ${p##*[![:space:]]}"}"
            if [ -n "$p" ]; then ARGS+=(--preserve "$p"); fi
          done
          if [ "${#ARGS[@]}" -eq 0 ]; then echo "No preserve requirements parsed" >&2; exit 2; fi
          if [ "$PLAN_ONLY" = "true" ]; then ARGS+=(--plan-only); fi
          python video_repair_lab.py \
            --source-video-url "$SOURCE" --kind "$KIND" --instruction "$INSTRUCTION" \
            --duration "$DURATION" --models "$MODELS" --max-budget-usd "$MAX_BUDGET" \
            --out-dir video_repair "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: video-repair-${{ github.run_id }}
          path: video_repair/
          retention-days: 7
