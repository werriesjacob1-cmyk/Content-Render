name: render-video

on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
    inputs:
      length_mode:
        description: "video length: auto (A/B alternate) | long (~40-46s) | short (~28-32s)"
        default: "auto"
      openrouter_model:
        description: "OPTIONAL one-off OpenRouter writer model override for THIS manual run only"
        default: ""
      gemini_model:
        description: "OPTIONAL one-off Gemini writer model for THIS run (e.g. gemini-3.8-flash). Empty = live discovery. Forces the model, skipping discovery."
        default: ""
      certification_only:
        description: "Run the real pipeline but skip all publish steps; output stays a private Actions artifact"
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 19 * * *"

permissions:
  contents: write

concurrency:
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    # During Writer V2.1 promotion, legacy scheduled generation/render spend is
    # opt-in. Manual workflow_dispatch and repository_dispatch remain explicit
    # operator actions and still work. Publishing has its own independent kill
    # switch below.
    if: ${{ github.event_name != 'schedule' || vars.LEGACY_SCHEDULED_GENERATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGE: science
      CONTENT_RENDER_QUEUE_WRITER_VERSION: legacy_v1
      CONTENT_RENDER_QUEUE_CERT_VERSION: legacy_generation
      CONTENT_RENDER_REQUIRED_WRITER_VERSION: legacy_v1
      CONTENT_RENDER_REQUIRED_CERT_VERSION: legacy_generation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure ffmpeg and fonts once
        shell: bash
        run: |
          set -euo pipefail
          need_apt=0
          command -v ffmpeg >/dev/null 2>&1 || need_apt=1
          font_family="$(fc-match -f '%{family}' 'DejaVu Sans' 2>/dev/null || true)"
          case "$font_family" in
            *DejaVu*) ;;
            *) need_apt=1 ;;
          esac
          if [ "$need_apt" -eq 1 ]; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version >/dev/null 2>&1
          font_family="$(fc-match -f '%{family}' 'DejaVu Sans' 2>/dev/null || true)"
          case "$font_family" in
            *DejaVu*) ;;
            *) echo "DejaVu font unavailable after prerequisite setup" >&2; exit 1 ;;
          esac

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voice-en_US-ryan-high-v1

      - name: Fetch Piper voice (local neural TTS)
        run: |
          mkdir -p voices
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high"
          if [ ! -s voices/voice.onnx ]; then
            curl -sSL -o voices/voice.onnx "$BASE/en_US-ryan-high.onnx" || echo "voice .onnx download failed"
            curl -sSL -o voices/voice.onnx.json "$BASE/en_US-ryan-high.onnx.json" || echo "voice .json download failed"
          fi
          ls -la voices/ || true

      - name: Auto-generate a fresh video idea
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_GENERATION: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # WRITER ONLY -- deliberately not set on the Render step, whose Gemini
          # use is the footage/QA judge (JUDGE_GEMINI_MODEL). Swapping both at
          # once would confound a writer A/B with a judge change.
          # Empty string leaves discovery untouched (generate.gemini_models only
          # treats a NON-empty GEMINI_MODEL as an override), so scheduled runs and
          # any dispatch that omits it behave exactly as before.
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || '' }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ github.event.inputs.openrouter_model || vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-5,openai/gpt-5,meta-llama/llama-3.3-70b-instruct' }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_MODEL: ${{ vars.TOGETHER_MODEL }}
          FIREWORKS_MODEL: ${{ vars.FIREWORKS_MODEL }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          export LENGTH_MODE="${{ github.event.inputs.length_mode || 'auto' }}"
          echo "[length] LENGTH_MODE=$LENGTH_MODE"

          # Pre-cutover inventory on this branch is known to be legacy-generated.
          # Stamp it once so every dequeue from now on has explicit factory
          # identity. The stamper refuses to relabel an already-versioned item.
          python quality_queue_contract.py --stamp \
            --queue-dir "queue_${PAGE}" \
            --writer-version "$CONTENT_RENDER_QUEUE_WRITER_VERSION" \
            --cert-version "$CONTENT_RENDER_QUEUE_CERT_VERSION"

          if python quality_queue_contract.py \
              --queue-dir "queue_${PAGE}" \
              --dequeue manifest.json \
              --required-writer "$CONTENT_RENDER_REQUIRED_WRITER_VERSION" \
              --required-cert "$CONTENT_RENDER_REQUIRED_CERT_VERSION"; then
            echo "rendering compatible pre-generated manifest from buffer (zero LLM calls)"
          else
            rc=$?
            if [ "$rc" -ne 3 ]; then
              echo "::error::queue compatibility check failed"; exit "$rc"
            fi
            echo "compatible buffer empty — generating live"
            python quality_production_generate.py manifest.json \
              || { echo "generate failed; waiting 90s and retrying once"; sleep 90; python quality_production_generate.py manifest.json; } \
              || { echo "::error::script generation failed twice — aborting so no weak/example video is rendered"; exit 1; }
          fi
          echo "--- generated manifest ---"
          head -c 400 manifest.json; echo

      - name: Write manifest from dispatch payload
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > manifest.json
          echo "manifest bytes: $(wc -c < manifest.json)"

      - name: Commit memory + manifest
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: |
          git config user.name "render-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A memory_*.json manifest.json dossier_cache_*.json 2>/dev/null || true
          git add -A queue_* 2>/dev/null || true
          git commit -m "auto: $PAGE video manifest" 2>/dev/null || echo "nothing to commit"
          for a in 1 2 3; do
            git push && break || { echo "push retry $a"; git pull --rebase origin "$(git branch --show-current)" 2>/dev/null || true; }
          done

      - name: Render
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
          MUSIC_URL: ${{ vars.MUSIC_URL }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_VIDEO_MODEL: ${{ vars.FAL_VIDEO_MODEL }}
          FAL_MAX_CLIPS: ${{ vars.FAL_MAX_CLIPS }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python main.py manifest.json

      - name: Commit footage dedup history
        if: always()
        run: |
          git config user.name "render-bot"
          git config user.email "bot@users.noreply.github.com"
          git add used_footage_*.json memory_*.json 2>/dev/null || true
          git commit -m "auto: update footage dedup + QA history ($PAGE)" 2>/dev/null || echo "nothing to commit"
          for a in 1 2 3; do
            git push && break || { echo "push retry $a"; git pull --rebase origin "$(git branch --show-current)" 2>/dev/null || true; }
          done

      - name: Prove output
        run: |
          echo "=== SIZE & HASH ==="
          ls -la out/final.mp4
          sha256sum out/final.mp4
          echo "=== STREAMS ==="
          ffprobe -v error -show_entries stream=codec_type,duration -of default=nw=1 out/final.mp4
          echo "=== FRAME BRIGHTNESS (low = black screen) ==="
          ffmpeg -hide_banner -i out/final.mp4 -vf "select=eq(n\,240),signalstats,metadata=print:key=lavfi.signalstats.YAVG" -frames:v 1 -f null - 2>&1 | grep YAVG || true
          echo "=== EXTRACT FRAME ==="
          ffmpeg -y -ss 8 -i out/final.mp4 -frames:v 1 out/proof_frame.png
          ls -la out/proof_frame.png

      - name: Repackage for all platforms
        env:
          BIO_LINK: ${{ vars.BIO_LINK }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
          LIST_NAME: ${{ vars.LIST_NAME }}
        run: python repackage.py out/final.mp4

      - name: Upload TikTok cut + review evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_number }}
          # ONE video encode while TikTok is the single review surface.
          # repackage.py still BUILDS every platform cut -- that is compute,
          # not storage, and storage is what is scarce -- so scaling back up to
          # all platforms later means re-listing them here, not touching the
          # pipeline. This step used to upload SEVEN encodes of the same video
          # with no retention-days at all, so it inherited the 90-day default:
          # the largest single consumer of a 0.5 GB/month Actions storage plan.
          #
          # The json/png review evidence stays: it is KB-scale, and qa_report /
          # proof_frame are how a render actually gets judged.
          path: |
            out/tiktok_reels_shorts.mp4
            out/cover.jpg
            out/post.json
            out/platforms.json
            out/platform_text.json
            out/funnel.json
            out/qa_report.json
            out/proof_frame.png
          retention-days: 7

      - name: Report publishing switch
        run: |
          if [ "${{ vars.AUTO_PUBLISH_ENABLED }}" = "true" ]; then
            echo "PUBLISHING ENABLED — AUTO_PUBLISH_ENABLED is exactly 'true'; publish steps may run only if all other guards pass"
          else
            echo "PUBLISHING DISABLED — master kill switch active; no Release and no Publer push can run"
          fi

      - name: Publish video as a GitHub Release (Buffer/Zapier pickup)
        if: ${{ vars.AUTO_PUBLISH_ENABLED == 'true' && github.event.inputs.certification_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VID=$(python -c "import json;print((json.load(open('out/post.json')).get('video_id') or '').strip())" 2>/dev/null || true)
          [ -z "$VID" ] && VID="render-${{ github.run_number }}"
          TITLE=$(python -c "import json;print((json.load(open('out/post.json')).get('title') or '').strip())" 2>/dev/null || true)
          FILES=""
          for f in tiktok_reels_shorts instagram_reels youtube_shorts facebook_reels square landscape final; do
            [ -f "out/$f.mp4" ] && FILES="$FILES out/$f.mp4"
          done
          for f in post platforms platform_text funnel qa_report; do
            [ -f "out/$f.json" ] && FILES="$FILES out/$f.json"
          done
          [ -f "out/cover.jpg" ] && FILES="$FILES out/cover.jpg"
          if [ -f out/release_body.md ]; then
            cp out/release_body.md out/release_notes.md
          else
            echo "${TITLE:-New science video}" > out/release_notes.md
          fi
          gh release create "$VID" $FILES --title "${TITLE:-$VID}" --notes-file out/release_notes.md \
            || gh release create "${VID}-r${{ github.run_number }}" $FILES --title "${TITLE:-$VID}" --notes-file out/release_notes.md \
            || echo "release publish skipped"

      - name: Push to Publer (direct API, optional)
        if: ${{ success() && vars.AUTO_PUBLISH_ENABLED == 'true' && github.event.inputs.certification_only != 'true' }}
        env:
          AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED }}
          PUBLER_API_KEY: ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID: ${{ secrets.PUBLER_WORKSPACE_ID }}
          PUBLER_ACCOUNT_IDS: ${{ vars.PUBLER_ACCOUNT_IDS }}
          PUBLER_STATE: ${{ vars.PUBLER_STATE }}
        run: python publish_publer.py out/final.mp4 out/release_body.md || true

      - name: Notify n8n (optional)
        if: always()
        env:
          HOOK: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            STATUS="${{ job.status }}"
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "$HOOK" -H "Content-Type: application/json" \
              -d "{\"status\":\"$STATUS\",\"run_url\":\"$RUN_URL\"}" || true
          fi
