name: render-video

on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
  schedule:
    # Once a day, 13:00 UTC. The "science" profile's intended posting window
    # is evening (7-10pm) in its audience's local time (see profiles.py
    # post_window) -- 13:00 UTC lands mid-afternoon US/EU, leaving a buffer
    # before evening posting for the run to finish (~15-20 min) and for a
    # human/n8n hand-off to review the artifact before it goes out. One run
    # per day matches one video per day: the manifest generator's dedup
    # memory (memory_science.json / used_footage_science.json) is sized and
    # tuned for a daily cadence, and GitHub Actions cron has no sub-hourly
    # resolution anyway. Bump the schedule (or add a second cron line for a
    # different PAGE) if/when the channel is ready to post more than 1x/day.
    - cron: "0 13 * * *"

permissions:
  contents: write   # the workflow commits manifest.json and used_footage_*.json
                     # back to the repo; without this the GITHUB_TOKEN defaults
                     # to read-only and every `git push` below silently no-ops.

concurrency:
  # Now that render.yml self-triggers on a schedule, it can overlap with a
  # manual workflow_dispatch or an n8n repository_dispatch. Both push
  # manifest.json / used_footage_*.json mid-run; two runs racing on those
  # pushes is how you get a rejected push (or, worse, one run's dedup
  # history silently clobbering the other's). Queue instead of running in
  # parallel -- cancel-in-progress stays false so a scheduled run is never
  # killed mid-render just because someone kicked off a manual one.
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # the footage judge/rescue adds up to ~3 Groq calls + 3 searches per scene;
    # 15 min was calibrated for the old first-result pipeline and left no room
    # for the ~3.5 min repackage step after a judged render
    timeout-minutes: 30
    env:
      PAGE: science          # change to history_pov / dark_mystery / ai_life to run another page
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ensure fonts
        # main.py hardcodes /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
        # for drawtext, and the karaoke captions resolve "DejaVu Sans"/"DejaVu
        # Serif" via fontconfig — neither is guaranteed present on the runner
        # image, and a missing font file makes ffmpeg's drawtext fail outright.
        run: |
          fc-list | grep -qi dejavu || (sudo apt-get update && sudo apt-get install -y fonts-dejavu-core)
          fc-cache -f >/dev/null 2>&1 || true
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Auto-generate a fresh video idea
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Gemini's free tier has a far larger daily quota than Groq's; when set,
          # generate.py prefers it so renders stop aborting at this step. Optional
          # — falls back to Groq if the secret is absent. Free key: aistudio.google.com
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # CRITICAL: never fall back to a hardcoded example on failure. Doing
          # that (the old `|| cp manifest_example.json`) published the IDENTICAL
          # "murmuration" example video on every generation failure — 4+ times —
          # which is the exact opposite of a consistently-good profile. A failed
          # generation (usually transient Groq rate-limit/quota) must instead
          # retry once, then ABORT the whole run: no render, no release, no
          # duplicate. The daily cron simply tries again next time.
          python generate.py manifest.json \
            || { echo "generate failed (likely a transient Groq rate-limit); waiting 90s and retrying once"; sleep 90; python generate.py manifest.json; } \
            || { echo "::error::script generation failed twice — aborting this run so no duplicate/example video is ever published"; exit 1; }
          echo "--- generated manifest ---"
          head -c 400 manifest.json; echo

      - name: Write manifest from dispatch payload
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > manifest.json
          echo "manifest bytes: $(wc -c < manifest.json)"

      - name: Commit memory + manifest
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: |
          git config user.name "render-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory_*.json manifest.json 2>/dev/null || true
          git commit -m "auto: $PAGE video manifest" 2>/dev/null || echo "nothing to commit"
          git push 2>/dev/null || echo "push skipped"

      - name: Render
        env:
          PEXELS_API_KEY:      ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          # footage-relevance judge prefers Gemini too (free-tier quota) so batch
          # rendering keeps picking relevant clips instead of shipping the top
          # Pexels result when Groq is rate-limited.
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
        run: python main.py manifest.json

      - name: Commit footage dedup history
        if: always()
        run: |
          git config user.name "render-bot"
          git config user.email "bot@users.noreply.github.com"
          git add used_footage_*.json 2>/dev/null || true
          git commit -m "auto: update footage dedup history ($PAGE)" 2>/dev/null || echo "nothing to commit"
          git push 2>/dev/null || echo "push skipped"

      - name: Prove output
        run: |
          echo "=== SIZE & HASH ==="
          ls -la out/final.mp4
          sha256sum out/final.mp4
          echo "=== STREAMS ==="
          ffprobe -v error -show_entries stream=codec_type,duration -of default=nw=1 out/final.mp4
          echo "=== FRAME BRIGHTNESS (low = black screen) ==="
          ffmpeg -hide_banner -i out/final.mp4 -vf "select=eq(n\,240),signalstats,metadata=print:key=lavfi.signalstats.YAVG" -frames:v 1 -f null - 2>&1 | grep YAVG || true
          echo "=== EXTRACT FRAME ==="
          ffmpeg -y -ss 8 -i out/final.mp4 -frames:v 1 out/proof_frame.png
          ls -la out/proof_frame.png

      - name: Repackage for all platforms
        # BIO_LINK / CHANNEL_HANDLE / LIST_NAME drive funnel.py's bio CTA,
        # pinned comment, and newsletter blurb. Set them once as repo VARIABLES
        # (Settings -> Secrets and variables -> Actions -> Variables) after you
        # create your bio-link + newsletter; until then funnel.py uses readable
        # placeholders so the metadata is still valid. See MONETIZATION.md.
        env:
          BIO_LINK:       ${{ vars.BIO_LINK }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
          LIST_NAME:      ${{ vars.LIST_NAME }}
        run: python repackage.py out/final.mp4

      - name: Upload all platform cuts
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_number }}
          path: |
            out/tiktok_reels_shorts.mp4
            out/instagram_reels.mp4
            out/youtube_shorts.mp4
            out/facebook_reels.mp4
            out/square.mp4
            out/landscape.mp4
            out/final.mp4
            out/post.json
            out/platforms.json
            out/platform_text.json
            out/funnel.json
            out/proof_frame.png
          retention-days: 7

      - name: Publish video as a GitHub Release (Buffer/Zapier pickup)
        # Gives each finished render a stable PUBLIC url with no extra storage
        # account and no new secret (uses the built-in GITHUB_TOKEN; the job
        # already has `permissions: contents: write`). A Zapier "New Release in
        # GitHub" trigger -> "Buffer: Add to Queue" action fans the attached
        # cuts + captions out to every connected channel. Runs only on a
        # successful render (no always()), so a broken run never publishes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VID=$(python -c "import json;print((json.load(open('out/post.json')).get('video_id') or '').strip())" 2>/dev/null || true)
          [ -z "$VID" ] && VID="render-${{ github.run_number }}"
          TITLE=$(python -c "import json;print((json.load(open('out/post.json')).get('title') or '').strip())" 2>/dev/null || true)
          # attach only the files that actually got produced this run
          FILES=""
          for f in tiktok_reels_shorts instagram_reels youtube_shorts facebook_reels square landscape final; do
            [ -f "out/$f.mp4" ] && FILES="$FILES out/$f.mp4"
          done
          for f in post platforms platform_text funnel; do
            [ -f "out/$f.json" ] && FILES="$FILES out/$f.json"
          done
          # release body = per-channel captions in Formatter-friendly markers
          # (repackage.py writes it); append the source-run link. Fall back to a
          # one-line note if the body file is somehow missing.
          if [ -f out/release_body.md ]; then
            { cat out/release_body.md; echo; echo "Source run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > out/release_notes.md
          else
            echo "Automated render. Cuts + captions attached. Source run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" > out/release_notes.md
          fi
          # a same-day re-run would collide on the tag; fall back to a run-suffixed tag
          gh release create "$VID" $FILES --title "${TITLE:-$VID}" --notes-file out/release_notes.md \
            || gh release create "${VID}-r${{ github.run_number }}" $FILES --title "${TITLE:-$VID}" --notes-file out/release_notes.md \
            || echo "release publish skipped"

      - name: Notify n8n (optional)
        if: always()
        env:
          HOOK: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            STATUS="${{ job.status }}"
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "$HOOK" -H "Content-Type: application/json" \
              -d "{\"status\":\"$STATUS\",\"run_url\":\"$RUN_URL\"}" || true
          fi
