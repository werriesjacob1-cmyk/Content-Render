name: render-video

on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
    inputs:
      length_mode:
        description: "video length: auto (A/B alternate) | long (~40-46s) | short (~28-32s)"
        default: "auto"
      openrouter_model:
        description: "OPTIONAL one-off OpenRouter writer model override for THIS manual run only
          (e.g. deepseek/deepseek-chat) -- leave blank to use the repo Variable / default
          (anthropic/claude-sonnet-5). Does NOT touch the daily cron's model; for A/B testing a
          different writer without changing the permanent default."
        default: ""
  schedule:
    # Once a day, 13:00 UTC. The "science" profile's intended posting window
    # is evening (7-10pm) in its audience's local time (see profiles.py
    # post_window) -- 13:00 UTC lands mid-afternoon US/EU, leaving a buffer
    # before evening posting for the run to finish (~15-20 min) and for a
    # human/n8n hand-off to review the artifact before it goes out. One run
    # per day matches one video per day: the manifest generator's dedup
    # memory (memory_science.json / used_footage_science.json) is sized and
    # tuned for a daily cadence, and GitHub Actions cron has no sub-hourly
    # resolution anyway. Bump the schedule (or add a second cron line for a
    # different PAGE) if/when the channel is ready to post more than 1x/day.
    # FOUR renders/day. Each first tries the pre-generated buffer
    # (generate.py --dequeue, ZERO LLM calls — buffer.yml fills it at 07:20 when
    # the free buckets are fresh), and only live-generates if the buffer is
    # empty. So more render slots = more videos/day WITHOUT more generation-quota
    # pressure, as long as the morning buffer-fill keeps up. They serialize via
    # the render-video concurrency group, so they never clobber each other's
    # memory/queue commits.
    # 2 renders/day (user cadence choice 2026-07-22). Spaced ~10h apart so the
    # two main-branch memory commits never collide, and each finishes well BEFORE
    # a Central-time posting wave: 09:00 UTC = 4am CT -> ready for the ~11am-1pm CT
    # midday posts; 19:00 UTC = 2pm CT -> ready for the ~5-7pm CT evening posts.
    # Both are after the 07:00 UTC Gemini quota reset. Bump back to 3-4 crons for
    # more volume once the channel is proven.
    - cron: "0 9 * * *"     # 4:00 AM CT — feeds the midday CT posting wave
    - cron: "0 19 * * *"    # 2:00 PM CT — feeds the evening CT posting wave

permissions:
  contents: write   # the workflow commits manifest.json and used_footage_*.json
                     # back to the repo; without this the GITHUB_TOKEN defaults
                     # to read-only and every `git push` below silently no-ops.
  models: read       # lets generate.py use the free GitHub Models API with the
                     # built-in token (or set a GITHUB_MODELS_TOKEN PAT secret).

concurrency:
  # Now that render.yml self-triggers on a schedule, it can overlap with a
  # manual workflow_dispatch or an n8n repository_dispatch. Both push
  # manifest.json / used_footage_*.json mid-run; two runs racing on those
  # pushes is how you get a rejected push (or, worse, one run's dedup
  # history silently clobbering the other's). Queue instead of running in
  # parallel -- cancel-in-progress stays false so a scheduled run is never
  # killed mid-render just because someone kicked off a manual one.
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # the footage judge/rescue adds up to ~3 Groq calls + 3 searches per scene;
    # 15 min was calibrated for the old first-result pipeline and left no room
    # for the ~3.5 min repackage step after a judged render
    timeout-minutes: 30
    env:
      PAGE: science          # change to history_pov / dark_mystery / ai_life to run another page
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ensure fonts
        # main.py hardcodes /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
        # for drawtext, and the karaoke captions resolve "DejaVu Sans"/"DejaVu
        # Serif" via fontconfig — neither is guaranteed present on the runner
        # image, and a missing font file makes ffmpeg's drawtext fail outright.
        run: |
          fc-list | grep -qi dejavu || (sudo apt-get update && sudo apt-get install -y fonts-dejavu-core)
          fc-cache -f >/dev/null 2>&1 || true
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Cache Piper voice
        # Restores the ~115 MB neural voice from cache so it isn't re-downloaded
        # every run; saves it (post-job) the first time.
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voice-en_US-ryan-high-v1

      - name: Fetch Piper voice (local neural TTS)
        # Downloads the voice model main.py's _piper_tts() looks for at
        # voices/voice.onnx, only if the cache didn't already provide it.
        # Best-effort: if the download fails the render simply falls back to
        # edge-tts, so this never blocks a run.
        run: |
          mkdir -p voices
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high"
          if [ ! -s voices/voice.onnx ]; then
            curl -sSL -o voices/voice.onnx      "$BASE/en_US-ryan-high.onnx"      || echo "voice .onnx download failed"
            curl -sSL -o voices/voice.onnx.json "$BASE/en_US-ryan-high.onnx.json" || echo "voice .json download failed"
          fi
          ls -la voices/ || true

      - name: Auto-generate a fresh video idea
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # 2026-08-03: OFF. The recurring "clumsy/jumbled/doesn't make sense"
          # narration complaints trace to the WRITER model, not to Gemini-vs-not.
          # Gemini's auto-discovered model on this key is "gemini-flash-latest" /
          # "gemini-3.5-flash" -- Google's FAST tier, not their strongest. The user
          # said explicitly to stop optimizing for cost and use the strongest
          # writer available: OpenRouter's default is now Claude Sonnet 5 / GPT-5
          # (see OPENROUTER_MODEL below), which leads the chain when this is unset/
          # "0". Gemini (still grounded, still has the vision footage judge) is the
          # backstop for nights OpenRouter is unavailable. Set to "1" to restore
          # Gemini-first.
          GEMINI_GENERATION: "0"
          # Gemini's free tier has a far larger daily quota than Groq's; when set,
          # generate.py prefers it so renders stop aborting at this step. Optional
          # — falls back to Groq if the secret is absent. Free key: aistudio.google.com
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Cerebras = 3rd free provider (backup when Gemini is rate-limited AND
          # Groq's daily budget is spent). Optional; free key: cloud.cerebras.ai
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # OpenRouter = 4th free provider; its free tier includes llama-3.3-70b
          # (stronger than Cerebras' free model) on a separate daily bucket.
          # Optional; free key (no card): openrouter.ai/keys
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # OpenRouter WRITER MODEL, now the PRIMARY writer (see GEMINI_GENERATION
          # above). 2026-08-01 overnight found gpt-4o cleared only 2/9 renders
          # (~22%), failing on a spread of different quality axes each time -- not
          # a strong enough writer to lean on. 2026-08-03: the user said stop
          # optimizing for cost, use whatever model gets consistently good videos;
          # default is now Claude Sonnet 5 first, GPT-5 second, the old 70b llama
          # last (comma-separated = tried in order within this one provider).
          # Env-overridable via a repo Variable (Settings -> Variables ->
          # OPENROUTER_MODEL) with no code change. A manual workflow_dispatch run
          # can override just itself via the openrouter_model input above, without
          # touching the permanent default the daily cron uses.
          OPENROUTER_MODEL: ${{ github.event.inputs.openrouter_model || vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-5,openai/gpt-5,meta-llama/llama-3.3-70b-instruct' }}
          # 5th-7th free providers, each a SEPARATE daily bucket that generate.py
          # tries after OpenRouter and before Cerebras (all run llama-3.3-70b /
          # mistral-small on their free tiers). Optional — absent keys are simply
          # skipped in the provider chain.
          TOGETHER_API_KEY:  ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          MISTRAL_API_KEY:   ${{ secrets.MISTRAL_API_KEY }}
          # Optional model-ID overrides (repo Variables, not secrets). Set e.g.
          # FIREWORKS_MODEL to a model the account actually has if the default 404s.
          TOGETHER_MODEL:    ${{ vars.TOGETHER_MODEL }}
          FIREWORKS_MODEL:   ${{ vars.FIREWORKS_MODEL }}
          MISTRAL_MODEL:     ${{ vars.MISTRAL_MODEL }}
          # GitHub Models (free): a PAT with models:read is preferred; falls back
          # to the built-in token via the `models: read` permission above.
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          GITHUB_TOKEN:        ${{ github.token }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL }}
        run: |
          # SCRIPT BUFFER: first try to render a PRE-GENERATED manifest from the
          # queue (queue_<page>/, filled by buffer.yml when the free LLM buckets
          # are fresh). A dequeue costs ZERO LLM calls, so the channel keeps
          # banking videos on days the buckets are already spent. `--dequeue`
          # exits 3 when the buffer is empty — the normal case today — and we
          # fall straight through to LIVE generation, byte-for-byte the previous
          # behaviour.
          #
          # CRITICAL: never fall back to a hardcoded example on failure. Doing
          # that (the old `|| cp manifest_example.json`) published the IDENTICAL
          # "murmuration" example video on every generation failure — 4+ times —
          # which is the exact opposite of a consistently-good profile. A failed
          # generation (usually transient Groq rate-limit/quota) must instead
          # retry once, then ABORT the whole run: no render, no release, no
          # duplicate. The daily cron simply tries again next time.
          # A/B video length: a manual dispatch can force long/short via the
          # length_mode input; cron/repository_dispatch send no input so this is
          # empty → generate.py defaults to "auto" (alternate per render). SHORT
          # currently scores weaker payoffs, so verification renders force "long".
          export LENGTH_MODE="${{ github.event.inputs.length_mode || 'auto' }}"
          echo "[length] LENGTH_MODE=$LENGTH_MODE"
          if python generate.py --dequeue manifest.json; then
            echo "rendering a pre-generated manifest from the buffer (no LLM used)"
          else
            echo "buffer empty — generating live"
            python generate.py manifest.json \
              || { echo "generate failed (likely a transient Groq rate-limit); waiting 90s and retrying once"; sleep 90; python generate.py manifest.json; } \
              || { echo "::error::script generation failed twice — aborting this run so no duplicate/example video is ever published"; exit 1; }
          fi
          echo "--- generated manifest ---"
          head -c 400 manifest.json; echo

      - name: Write manifest from dispatch payload
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > manifest.json
          echo "manifest bytes: $(wc -c < manifest.json)"

      - name: Commit memory + manifest
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: |
          git config user.name "render-bot"
          git config user.email "bot@users.noreply.github.com"
          # Stage the always-present state files FIRST, on their own line. A
          # single `git add memory_*.json manifest.json ... queue_*` aborts
          # ATOMICALLY (stages nothing) when any one pathspec matches no files —
          # and on the live-gen path (empty buffer, the normal case) `queue_*`
          # matches nothing, so the manifest + memory + dossier never committed.
          # That silently froze memory_science.json's used-fact/domain history
          # (topic diversity) and left a STALE manifest on the branch.
          git add -A memory_*.json manifest.json dossier_cache_*.json 2>/dev/null || true
          # -A on the queue path stages the DELETION of a just-dequeued manifest
          # too; separate line so an empty queue_* glob can't abort the add above.
          git add -A queue_* 2>/dev/null || true
          git commit -m "auto: $PAGE video manifest" 2>/dev/null || echo "nothing to commit"
          # Rebase-retry so a moved origin doesn't silently drop the memory/manifest
          # commit (topic-diversity history must persist). Mirrors buffer.yml.
          for a in 1 2 3; do
            git push && break || { echo "push retry $a"; git pull --rebase origin "$(git branch --show-current)" 2>/dev/null || true; }
          done

      - name: Render
        env:
          PEXELS_API_KEY:      ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          # footage-relevance judge prefers Gemini too (free-tier quota) so batch
          # rendering keeps picking relevant clips instead of shipping the top
          # Pexels result when Groq is rate-limited.
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY:    ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          # burned onto the auto-generated cover thumbnail (out/cover.jpg); if the
          # repo Variable isn't set the handle line is simply omitted.
          CHANNEL_HANDLE:      ${{ vars.CHANNEL_HANDLE }}
          # paste a royalty-free music track URL here (repo Variable) to use as the
          # music bed for every render — overrides the bundled loop, no file commit
          # needed. Leave unset to use the committed per-profile track.
          MUSIC_URL:           ${{ vars.MUSIC_URL }}
          # AI-VIDEO GAP-FILL (fal.ai): when a scene's stock footage is off-topic or
          # missing, generate an ON-TOPIC AI video clip instead. Fires ONLY on weak
          # scenes and is capped at FAL_MAX_CLIPS/video, so cost is a few cents on the
          # occasional abstract topic and $0 on topics with good stock. No secret set
          # => the feature is a no-op (free-tier behaviour unchanged).
          FAL_KEY:             ${{ secrets.FAL_KEY }}
          # optional overrides (no code edit): swap the t2v model or the per-video cap.
          FAL_VIDEO_MODEL:     ${{ vars.FAL_VIDEO_MODEL }}
          FAL_MAX_CLIPS:       ${{ vars.FAL_MAX_CLIPS }}
          # Pollinations.ai (Flux) — FREE AI-illustration gap-fill, tried BEFORE the
          # paid Gemini/Imagen call below (see _pollinations_image in main.py). $0:
          # a free account at enter.pollinations.ai, no billing ever. Absent secret
          # = feature is a no-op, falls straight through to Imagen unchanged.
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python main.py manifest.json

      - name: Commit footage dedup history
        if: always()
        run: |
          git config user.name "render-bot"
          git config user.email "bot@users.noreply.github.com"
          # main.py now also writes the final-QA verdict (footage_matches_narration,
          # narration_flow, etc.) back into memory_<page>.json's history entry for
          # this video (_persist_qa_to_memory) -- stage it here too, not just the
          # footage dedup file, or that signal never reaches the branch.
          git add used_footage_*.json memory_*.json 2>/dev/null || true
          git commit -m "auto: update footage dedup + QA history ($PAGE)" 2>/dev/null || echo "nothing to commit"
          for a in 1 2 3; do
            git push && break || { echo "push retry $a"; git pull --rebase origin "$(git branch --show-current)" 2>/dev/null || true; }
          done

      - name: Prove output
        run: |
          echo "=== SIZE & HASH ==="
          ls -la out/final.mp4
          sha256sum out/final.mp4
          echo "=== STREAMS ==="
          ffprobe -v error -show_entries stream=codec_type,duration -of default=nw=1 out/final.mp4
          echo "=== FRAME BRIGHTNESS (low = black screen) ==="
          ffmpeg -hide_banner -i out/final.mp4 -vf "select=eq(n\,240),signalstats,metadata=print:key=lavfi.signalstats.YAVG" -frames:v 1 -f null - 2>&1 | grep YAVG || true
          echo "=== EXTRACT FRAME ==="
          ffmpeg -y -ss 8 -i out/final.mp4 -frames:v 1 out/proof_frame.png
          ls -la out/proof_frame.png

      - name: Repackage for all platforms
        # BIO_LINK / CHANNEL_HANDLE / LIST_NAME drive funnel.py's bio CTA,
        # pinned comment, and newsletter blurb. Set them once as repo VARIABLES
        # (Settings -> Secrets and variables -> Actions -> Variables) after you
        # create your bio-link + newsletter; until then funnel.py uses readable
        # placeholders so the metadata is still valid. See MONETIZATION.md.
        env:
          BIO_LINK:       ${{ vars.BIO_LINK }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
          LIST_NAME:      ${{ vars.LIST_NAME }}
        run: python repackage.py out/final.mp4

      - name: Upload all platform cuts
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_number }}
          path: |
            out/tiktok_reels_shorts.mp4
            out/instagram_reels.mp4
            out/youtube_shorts.mp4
            out/facebook_reels.mp4
            out/square.mp4
            out/landscape.mp4
            out/final.mp4
            out/cover.jpg
            out/post.json
            out/platforms.json
            out/platform_text.json
            out/funnel.json
            out/qa_report.json
            out/proof_frame.png
          retention-days: 7

      - name: Publish video as a GitHub Release (Buffer/Zapier pickup)
        # Gives each finished render a stable PUBLIC url with no extra storage
        # account and no new secret (uses the built-in GITHUB_TOKEN; the job
        # already has `permissions: contents: write`). A Zapier "New Release in
        # GitHub" trigger -> "Buffer: Add to Queue" action fans the attached
        # cuts + captions out to every connected channel. Runs only on a
        # successful render (no always()), so a broken run never publishes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VID=$(python -c "import json;print((json.load(open('out/post.json')).get('video_id') or '').strip())" 2>/dev/null || true)
          [ -z "$VID" ] && VID="render-${{ github.run_number }}"
          TITLE=$(python -c "import json;print((json.load(open('out/post.json')).get('title') or '').strip())" 2>/dev/null || true)
          # attach only the files that actually got produced this run
          FILES=""
          for f in tiktok_reels_shorts instagram_reels youtube_shorts facebook_reels square landscape final; do
            [ -f "out/$f.mp4" ] && FILES="$FILES out/$f.mp4"
          done
          for f in post platforms platform_text funnel qa_report; do
            [ -f "out/$f.json" ] && FILES="$FILES out/$f.json"
          done
          # the designed cover thumbnail (bold hook on the best clean frame) so
          # whoever posts has a ready cover instead of TikTok's black default
          [ -f "out/cover.jpg" ] && FILES="$FILES out/cover.jpg"
          # release body = the CLEAN universal caption + hashtags (repackage.py
          # writes it). It is the post caption verbatim: the Zap maps Publer's Text
          # field straight to the GitHub {{Body}} field, so NOTHING else may go in
          # here — no "Source run" footer, no boilerplate — or it would land in the
          # social caption. (The run link is still on the Actions run + the commit.)
          # Fall back to just the title if the body file is somehow missing.
          if [ -f out/release_body.md ]; then
            cp out/release_body.md out/release_notes.md
          else
            echo "${TITLE:-New science video}" > out/release_notes.md
          fi
          # a same-day re-run would collide on the tag; fall back to a run-suffixed tag
          gh release create "$VID" $FILES --title "${TITLE:-$VID}" --notes-file out/release_notes.md \
            || gh release create "${VID}-r${{ github.run_number }}" $FILES --title "${TITLE:-$VID}" --notes-file out/release_notes.md \
            || echo "release publish skipped"

      - name: Push draft to Publer (direct API, optional)
        # DIRECT replacement for the "Release -> Zapier -> Publer" hop, which stalls
        # whenever Zapier's free task cap or Publer OAuth expires. Dormant unless the
        # PUBLER_* secrets are set (publish_publer.py exits 0 as a no-op), so nothing
        # changes for anyone not on Publer's Business plan. Never fails the run — the
        # video is already on the Release regardless.
        if: success()
        env:
          PUBLER_API_KEY:      ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID: ${{ secrets.PUBLER_WORKSPACE_ID }}
          PUBLER_ACCOUNT_IDS:  ${{ vars.PUBLER_ACCOUNT_IDS }}
          PUBLER_STATE:        ${{ vars.PUBLER_STATE }}
        run: python publish_publer.py out/final.mp4 out/release_body.md || true

      - name: Notify n8n (optional)
        if: always()
        env:
          HOOK: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            STATUS="${{ job.status }}"
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "$HOOK" -H "Content-Type: application/json" \
              -d "{\"status\":\"$STATUS\",\"run_url\":\"$RUN_URL\"}" || true
          fi
