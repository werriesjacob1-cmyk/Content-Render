name: expand-topic-bank

# Grows topic_bank.json toward ~500 genuinely-WTF facts over time. Each run adds a
# BOUNDED number (--add) so a nightly job's LLM spend stays small and the bank
# climbs steadily instead of one expensive blast. Strict WTF gate + dedup live in
# expand_bank.py. Runs after the 07:00 UTC quota reset (Gemini fresh); also manual.
on:
  workflow_dispatch:
    inputs:
      add:
        description: "max NEW facts to add this run"
        default: "60"
      target:
        description: "overall bank-size target (stops here)"
        default: "500"
  schedule:
    # 21:00 UTC — AFTER both daily renders (09:00 + 19:00), so bank expansion uses
    # only LEFTOVER Gemini quota and never steals the render's fresh morning quota.
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: bank-expand
  cancel-in-progress: false

jobs:
  expand:
    # Same transition guard the other scheduled provider-spending lanes carry
    # (render.yml, buffer.yml). This was the ONE cron that could still reach
    # paid Gemini/OpenRouter generation with nothing enabled, and it also
    # auto-commits its result -- so an unattended run spent credit and mutated
    # the repo with no human switch anywhere in the path. Manual dispatch is an
    # explicit operator action and stays available.
    if: ${{ github.event_name != 'schedule' || vars.LEGACY_SCHEDULED_GENERATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Expand the topic bank (strict WTF gate + dedup)
        env:
          # Gemini-first + grounded gives the most accurate, novel facts; the free
          # chain backs it up. A bounded --add keeps the spend to pennies/run.
          GEMINI_GENERATION: "1"
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          python expand_bank.py \
            --add "${{ github.event.inputs.add || '40' }}" \
            --target "${{ github.event.inputs.target || '500' }}" \
            --batch 25
          echo "--- bank size ---"
          python -c "import json;print(len(json.load(open('topic_bank.json'))['facts']),'facts')"
      - name: Validate expanded bank before commit (zero quota)
        env:
          GROQ_API_KEY: x
        run: |
          set -euo pipefail
          python tests/test_pipeline.py
      - name: Commit new facts
        run: |
          git config user.name "bank-bot"
          git config user.email "bot@users.noreply.github.com"
          git add topic_bank.json
          git commit -m "auto: expand topic bank toward 500 (WTF facts)" 2>/dev/null || echo "nothing to commit"
          pushed=0
          for a in 1 2 3; do
            if git push; then
              pushed=1
              break
            fi
            echo "push retry $a"
            # There is no fourth attempt. Do not mutate/revalidate after the
            # final failed push and then accidentally let the step exit 0.
            if [ "$a" -eq 3 ]; then
              break
            fi
            git pull --rebase origin "$(git branch --show-current)"
            # The rebase changes the exact tree we are about to publish. Re-run
            # the same zero-quota integrity suite so a concurrent bank update
            # cannot turn a previously-valid local commit into an unvalidated
            # combined bank before the next push attempt.
            GROQ_API_KEY=x python tests/test_pipeline.py
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::topic-bank commit could not be pushed after 3 attempts"
            exit 1
          fi
