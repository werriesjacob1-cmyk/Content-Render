name: fill-script-buffer

# Pre-generate manifests into queue_<page> while provider capacity is available.
# During the Writer V2.1 transition, scheduled legacy spending is opt-in through
# LEGACY_SCHEDULED_GENERATION_ENABLED=true. Manual dispatch remains available.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many manifests to try to buffer (stops early if a bucket is exhausted)"
        required: true
        default: "6"
  schedule:
    - cron: "20 7 * * *"

permissions:
  contents: write

concurrency:
  group: render-video
  cancel-in-progress: false

jobs:
  buffer:
    # Control-plane spend guard: a cron must not quietly burn newly-funded
    # Gemini capacity on the legacy Writer during V2.1 promotion work. Manual
    # runs are still explicit operator actions and remain available.
    if: ${{ github.event_name != 'schedule' || vars.LEGACY_SCHEDULED_GENERATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGE: science
      CONTENT_RENDER_QUEUE_WRITER_VERSION: legacy_v1
      CONTENT_RENDER_QUEUE_CERT_VERSION: legacy_generation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fill the buffer
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GEMINI_GENERATION:  "1"
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY:   ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY:  ${{ secrets.FIREWORKS_API_KEY }}
          MISTRAL_API_KEY:    ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_MODEL:     ${{ vars.TOGETHER_MODEL }}
          FIREWORKS_MODEL:    ${{ vars.FIREWORKS_MODEL }}
          MISTRAL_MODEL:      ${{ vars.MISTRAL_MODEL }}
        run: |
          set -euo pipefail
          COUNT="${{ github.event.inputs.count || '6' }}"
          echo "buffering up to $COUNT manifest(s)"
          made=0
          for i in $(seq 1 "$COUNT"); do
            echo "=== buffering manifest $i/$COUNT ==="
            # Capability-aware wrapper skips Groq only when this exact request
            # cannot fit its known TPM envelope; all other provider behavior is
            # unchanged.
            if python quality_production_generate.py --enqueue; then
              made=$((made+1))
            else
              echo "enqueue $i aborted (bucket exhausted or below quality floor) — stopping batch"
              break
            fi
          done
          # Every buffered manifest gets explicit Writer/certification identity.
          # This prevents legacy inventory from crossing a future V2.1 cutover.
          python quality_queue_contract.py --stamp \
            --queue-dir "queue_${PAGE}" \
            --writer-version "$CONTENT_RENDER_QUEUE_WRITER_VERSION" \
            --cert-version "$CONTENT_RENDER_QUEUE_CERT_VERSION"
          echo "buffered $made new manifest(s) this run"

      - name: Commit the buffered scripts
        run: |
          git config user.name "render-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A memory_*.json dossier_cache_*.json 2>/dev/null || true
          git add -A queue_* 2>/dev/null || true
          git commit -m "auto: fill $PAGE script buffer" 2>/dev/null || echo "nothing to commit"
          for a in 1 2 3 4; do
            git push && break || { echo "push retry $a"; sleep $((2**a)); git pull --rebase origin "$(git branch --show-current)" || true; }
          done
