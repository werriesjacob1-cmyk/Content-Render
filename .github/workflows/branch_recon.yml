name: branch-recon

# Generic zero-secret diagnostic runner for experiment branches.
#
# SECURITY CONTRACT:
# - This workflow may check out arbitrary repository refs and execute a Python
#   diagnostic from that ref, so the checked-out code is intentionally treated
#   as untrusted.
# - Untrusted branch code MUST NOT receive repository/provider secrets.
# - The job has read-only repository permissions and checkout credentials are
#   removed before the diagnostic runs.
# - Secret-backed/provider diagnostics belong in purpose-built workflows whose
#   executable logic is trusted on the default branch. Do not re-add secrets to
#   this generic runner.
# - Manual dispatch only. No render, publish, deploy, merge, or posting action.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to inspect"
        required: true
      script:
        description: "Python diagnostic path inside that ref (repo-relative)"
        required: true
        default: "wr2_recon.py"

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout requested ref without retained credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate diagnostic path
        env:
          RECON_SCRIPT: ${{ inputs.script }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ.get("RECON_SCRIPT", "")
          if not raw or not raw.endswith(".py"):
              raise SystemExit("::error::script must be a non-empty .py path")

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          candidate = (workspace / raw).resolve()
          try:
              candidate.relative_to(workspace)
          except ValueError:
              raise SystemExit("::error::script must remain inside GITHUB_WORKSPACE")

          if not candidate.is_file():
              raise SystemExit("::error::script does not exist as a file in the checked-out ref")
          PY

      - name: Run zero-secret recon script
        env:
          RECON_SCRIPT: ${{ inputs.script }}
          BRANCH_RECON_ZERO_SECRET: "1"
        run: python "$RECON_SCRIPT"
