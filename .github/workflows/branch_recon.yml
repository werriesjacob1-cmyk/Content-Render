name: branch-recon

# Generic zero-secret diagnostic runner for experiment branches.
#
# SECURITY CONTRACT:
# - This workflow may check out arbitrary repository refs and execute a Python
#   diagnostic from that ref, so the checked-out code is intentionally treated
#   as untrusted.
# - Untrusted branch code MUST NOT receive repository/provider secrets.
# - The job has read-only repository permissions and checkout credentials are
#   removed before the diagnostic runs.
# - Secret-backed/provider diagnostics belong in purpose-built workflows whose
#   executable logic is trusted on the default branch. Do not re-add secrets to
#   this generic runner.
# - Manual dispatch only. No render, publish, deploy, merge, or posting action.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to inspect"
        required: true
      script:
        description: "Python diagnostic path inside that ref (repo-relative)"
        required: true
        default: "wr2_recon.py"

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout requested ref without retained credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Do not invoke Python before this guard: Python startup from an untrusted
      # checkout can import sitecustomize.py from the working directory.
      - name: Validate diagnostic path without executing branch Python
        shell: bash
        env:
          RECON_SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail
          if [[ -z "$RECON_SCRIPT" || "$RECON_SCRIPT" != *.py ]]; then
            echo "::error::script must be a non-empty .py path"
            exit 1
          fi

          workspace="$(realpath -e -- "$GITHUB_WORKSPACE")"
          if ! candidate="$(realpath -e -- "$RECON_SCRIPT")"; then
            echo "::error::script does not exist in the checked-out ref"
            exit 1
          fi
          if [[ ! -f "$candidate" ]]; then
            echo "::error::script must resolve to a regular file"
            exit 1
          fi

          case "$candidate" in
            "$workspace"/*) ;;
            *)
              echo "::error::script must remain inside GITHUB_WORKSPACE"
              exit 1
              ;;
          esac

      - name: Run zero-secret recon script
        shell: bash
        env:
          RECON_SCRIPT: ${{ inputs.script }}
          BRANCH_RECON_ZERO_SECRET: "1"
        run: |
          set -euo pipefail
          script_path="$(realpath -e -- "$RECON_SCRIPT")"
          exec python "$script_path"
