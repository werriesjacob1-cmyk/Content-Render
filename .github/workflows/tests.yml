name: tests

# Gate every PR on zero-quota logic tests. The integration quality-stack tests
# import the grafted modules and verify safe defaults without network calls.
on:
  pull_request:
  push:
    branches:
      - main
      - claude/epic-edison-jybjd1

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run zero-quota test suite
        env:
          GROQ_API_KEY: x
        run: |
          python tests/test_pipeline.py
          # Remove the dummy key so integration tests can prove provider calls
          # fail closed rather than mistaking CI scaffolding for a credential.
          env -u GROQ_API_KEY python tests/test_quality_stack.py
          env -u GROQ_API_KEY python tests/test_review_readiness.py
          env -u GROQ_API_KEY python quality_stack_cli.py --status-only > /dev/null
