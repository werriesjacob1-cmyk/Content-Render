name: tests

# Gate every PR (and pushes to the working branch) on the zero-quota test suite —
# 99 pure-logic checks over validate(), caption alignment, footage anchoring,
# the brightness shadow-lift, the script buffer, etc. The suite needs NO network,
# NO ffmpeg, NO LLM key and NO pip install (main.py / generate.py import only the
# stdlib + the local profiles module), so this runs in a few seconds.

on:
  pull_request:
  push:
    branches:
      - main
      - claude/epic-edison-jybjd1

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run zero-quota test suite
        # GROQ_API_KEY is set to a dummy so the provider-chain code paths the tests
        # exercise see a key present; the tests never make a network call.
        env:
          GROQ_API_KEY: x
        run: |
          python tests/test_pipeline.py
          python tests/test_video_repair_lab.py
