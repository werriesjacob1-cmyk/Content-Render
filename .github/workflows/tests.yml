name: tests

# Gate every PR (and selected working-branch pushes) on the zero-quota suite.
# These checks need no network, ffmpeg, provider spend, or package install.

on:
  pull_request:
  push:
    branches:
      - main
      - claude/epic-edison-jybjd1
      - superchad/mission-1b-branch-recon-hardening-01

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run zero-quota test suite
        # Dummy key preserves legacy provider-chain test setup; tests make no
        # network/provider calls and branch_recon itself receives no secrets.
        env:
          GROQ_API_KEY: x
        run: |
          python tests/test_pipeline.py
          python tests/test_branch_recon_security.py
