name: tests

# Gate every PR on the legacy zero-quota suite plus focused Writer V2.1
# diagnostics and the additive production-quality stack. No suite makes
# network calls; provider-aware quality-stack tests run with GROQ_API_KEY unset.
on:
  pull_request:
  push:
    branches:
      - main
      - claude/epic-edison-jybjd1
      - superchad/writer-v2-semantic-failclosed-01
      - claude/p0-manifest-semantic-merge-01
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Prove checkout identity and required quality paths
        run: |
          echo "checked_out_sha=$(git rev-parse HEAD)"
          # Canonical Writer V2.1 / Mission 2 paths.
          test -f writer_v21_visual_preflight.py
          test -f tests/test_writer_v21_visual_feasibility.py
          test -f wr21_takeover_bakeoff.py
          test -f wr21_run.py
          test -f writer_v21_quality_bakeoff.py
          test -f writer_v21_factual_audit.py
          test -f writer_v21_provider_guardrail.py
          test -f wr21_quality_bakeoff.py
          test -f wr21_quality_preregister.py
          test -f wr21_quality_generate.py
          test -f tests/test_writer_v21_quality_bakeoff.py
          test -f tests/test_writer_v21_quality_bakeoff_integrity.py
          test -f tests/test_writer_v21_factual_audit.py
          test -f tests/test_writer_v21_provider_guardrail.py
          # Current-main quality-stack carry-forward. The obsolete September-4
          # writer_v21_adapter is intentionally NOT required: canonical Writer
          # V2.1 remains the source of truth.
          for f in \
            asset_gateway.py capability_preflight.py final_video_qa.py \
            generated_media_controller.py image_to_video_bakeoff.py molecular_media.py \
            quality_runtime.py quality_session.py quality_stack.py quality_stack_cli.py \
            quality_render_bridge.py research_grounding.py review_readiness.py \
            science_motion.py scientific_media.py sound_brain.py still_model_bakeoff.py \
            story_packet.py video_model_bakeoff.py video_repair_lab.py vision_gateway.py \
            visual_director.py visual_torture_corpus.py voice_bakeoff.py; do
            test -f "$f"
          done
          test ! -f writer_v21_adapter.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run zero-quota test suites
        env:
          GROQ_API_KEY: x
          # Python 3.11 sets sys.path[0] to tests/ when a test file is executed
          # by path. Keep the checked-out repository root explicitly importable
          # so top-level modules are tested exactly from this head.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -uo pipefail
          failed=0
          run_check() {
            label="$1"; shift
            echo "::group::$label"
            "$@"
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=Zero-quota check failed::$label exited $rc"
              failed=1
            fi
          }
          run_check "legacy pipeline" python tests/test_pipeline.py
          run_check "semantic gate" python tests/test_writer_v21_semantic_gate.py
          run_check "quality signals" python tests/test_writer_v21_quality_signals.py
          run_check "editorial diagnostics" python tests/test_writer_v21_editorial_diagnostics.py
          run_check "spoken manifest" python tests/test_writer_v21_manifest.py
          run_check "repair regression" python tests/test_writer_v21_repair_regression.py
          run_check "blind pairwise" python tests/test_writer_v21_pairwise.py
          run_check "known-bad torture corpus" python tests/test_writer_v21_torture_corpus.py
          run_check "story shape + first 8s" python tests/test_writer_v21_story_shape.py
          run_check "hook surfaces + payoff proof" python tests/test_writer_v21_hook_payoff.py
          run_check "visual feasibility" python tests/test_writer_v21_visual_feasibility.py
          run_check "quality proof harness" python tests/test_writer_v21_quality_bakeoff.py
          run_check "symmetric factual audit" python tests/test_writer_v21_factual_audit.py
          run_check "provider comparability" python tests/test_writer_v21_provider_guardrail.py
          run_check "sealed quality evidence" python tests/test_writer_v21_quality_bakeoff_integrity.py

          # Production-quality stack regressions. Unset the CI dummy key so
          # provider-aware modules prove their fail-closed zero-spend behavior.
          run_check "quality stack" env -u GROQ_API_KEY python tests/test_quality_stack.py
          run_check "story packet" env -u GROQ_API_KEY python tests/test_story_packet.py
          run_check "quality session" env -u GROQ_API_KEY python tests/test_quality_session.py
          run_check "quality render bridge" env -u GROQ_API_KEY python tests/test_quality_render_bridge.py
          run_check "image-to-video controller" env -u GROQ_API_KEY python tests/test_image_to_video_bakeoff.py
          run_check "generated-media controller" env -u GROQ_API_KEY python tests/test_generated_media_controller.py
          run_check "capability preflight" env -u GROQ_API_KEY python tests/test_capability_preflight.py
          run_check "review readiness" env -u GROQ_API_KEY python tests/test_review_readiness.py
          run_check "visual torture routing" env -u GROQ_API_KEY python tests/test_visual_torture_corpus.py
          run_check "quality-stack status" env -u GROQ_API_KEY python quality_stack_cli.py --status-only
          run_check "quality-stack preflight" env -u GROQ_API_KEY python quality_stack_cli.py --preflight

          run_check "live runner + quality-stack syntax preflight" python -m py_compile \
            wr21_takeover_bakeoff.py wr21_run.py writer_v21_visual_preflight.py \
            writer_v21_quality_bakeoff.py writer_v21_factual_audit.py \
            writer_v21_provider_guardrail.py wr21_quality_bakeoff.py \
            wr21_quality_preregister.py wr21_quality_generate.py \
            asset_gateway.py capability_preflight.py final_video_qa.py \
            generated_media_controller.py image_to_video_bakeoff.py molecular_media.py \
            quality_runtime.py quality_session.py quality_stack.py quality_stack_cli.py \
            quality_render_bridge.py research_grounding.py review_readiness.py \
            science_motion.py scientific_media.py sound_brain.py still_model_bakeoff.py \
            story_packet.py video_model_bakeoff.py video_repair_lab.py vision_gateway.py \
            visual_director.py visual_torture_corpus.py voice_bakeoff.py
          exit "$failed"
