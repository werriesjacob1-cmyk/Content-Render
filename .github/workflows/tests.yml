name: tests

# Gate every PR (and pushes to the working branch) on the zero-quota test suite.

on:
  pull_request:
  push:
    branches:
      - main
      - claude/epic-edison-jybjd1

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run zero-quota test suite
        env:
          GROQ_API_KEY: x
        run: |
          python tests/test_pipeline.py
          python tests/test_voice_lab.py
