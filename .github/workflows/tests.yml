name: tests

# Gate every PR on the legacy zero-quota suite plus focused Writer V2.1
# semantic-safety, scorer telemetry, and editorial diagnostics. No suite makes
# network calls.

on:
  pull_request:
  push:
    branches:
      - main
      - claude/epic-edison-jybjd1
      - superchad/writer-v2-semantic-failclosed-01

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run zero-quota test suites
        env:
          GROQ_API_KEY: x
        run: |
          python tests/test_pipeline.py
          python tests/test_writer_v21_semantic_gate.py
          python tests/test_writer_v21_quality_signals.py
          python tests/test_writer_v21_editorial_diagnostics.py
